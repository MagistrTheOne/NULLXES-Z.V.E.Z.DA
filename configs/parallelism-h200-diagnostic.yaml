schema_version: 1
program: Z.V.E.Z.D.A
revision: "0.8-smoke-minimal-gpu"

hardware:
  provider: runpod
  gpu: H200_SXM
  gpus_per_pod: 2
  launch_only: true
  hbm_per_gpu_gb: 141
  local_execution_allowed: false

parallelism:
  smoke:
    strategy: fsdp_full_shard
    activation_checkpointing: true
    note: "Smoke validates init+train path on minimal GPUs; not production parallelism."
  production_pretrain:
    tensor_parallel: 2
    pipeline_parallel: 1
    data_parallel: 4
    context_parallel: 1
    expert_parallel: 1
    gpus_per_node: 8
    note: "Reserved for full pretrain after dense smoke gates; not used in smoke_train."

precision:
  transformer_engine: false
  canonical_weights: bf16
  quantized_runtime: fp8
  master_weights: bf16
  router: fp32
  softmax: fp32
  loss: fp32
  smoke_note: "Smoke uses native PyTorch FSDP+BF16; TE/FP8 is production path."

phases:
  init_checkpoint:
    min_gpus: 0
    recommended_gpus: 1
    note: "CPU streaming write; GPU optional."
  smoke_train:
    min_gpus: 2
    recommended_gpus: 2
    min_hbm_per_gpu_gb: 141
    note: "FSDP full-shard: 141 GB H200 cannot hold 15B BF16+Adam alone (~179 GB)."

storage:
  launch_provider: runpod
  aws_allowed: false
  cloud_only: true
  pod_workspace: /workspace/zvezda
  pod_cache: /workspace/zvezda/cache
  tokenizer_bundle: /workspace/zvezda/artifacts/tokenizer
  init_checkpoint: /workspace/zvezda/artifacts/init
  smoke_output: /workspace/zvezda/artifacts/smoke
