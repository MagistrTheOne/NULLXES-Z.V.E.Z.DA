schema_version: 1
program: Z.V.E.Z.D.A
revision: "0.7-runpod-only"
purpose: runpod_init_and_smoke_train
pretrain_claim: false
launch_provider: runpod

commands:
  validate_manifest: python scripts/validate_corpus_manifest.py --manifest configs/tokenizer/corpus-manifest.yaml --probe-storage
  train_tokenizer: python scripts/train_tokenizer.py --config configs/tokenizer/zvezda-bpe-152k-diagnostic.yaml --corpus-manifest configs/tokenizer/corpus-manifest.yaml --storage-config configs/data/runpod-storage-v0.yaml --output-dir /workspace/zvezda/artifacts/tokenizer --probe-storage
  pod_preflight: python scripts/pod_preflight.py --launch configs/diagnostic/pod-launch.yaml --probe-storage
  init_checkpoint: python scripts/init_checkpoint.py --config configs/zvezda-15b-dense.yaml --init-policy configs/init/init-policy-v0.yaml --output-dir /workspace/zvezda/artifacts/init/zvezda-15b-dense --global-seed 20260703
  smoke_train: torchrun --nproc_per_node=2 scripts/smoke_train.py --launch configs/diagnostic/pod-launch.yaml

notes:
  - RunPod only. Corpus on network volume via runpod:// paths.
  - No AWS. VK/Yandex documented in storage-providers-internal.yaml — not active.
  - Stubs, placeholders, and template URIs fail validation.
