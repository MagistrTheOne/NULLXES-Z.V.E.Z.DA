schema_version: 1
program: Z.V.E.Z.D.A
revision: "1.0-b200-single-gpu-survival-smoke"
purpose: single_gpu_survival_smoke
pretrain_claim: false

pod:
  provider: runpod
  gpu: B200_SXM
  gpu_count: 1
  hbm_per_gpu_gb: 180
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  image_note: "B200 requires PyTorch 2.8+. Plain python smoke_train.py — no torchrun/DDP/FSDP."

paths:
  repo_root: /workspace/NULLXES-Z.V.E.Z.D.A
  workspace: /workspace/zvezda
  corpus_root: /workspace/corpus
  tokenizer_bundle_dir: /workspace/zvezda/artifacts/tokenizer
  init_checkpoint_dir: /workspace/zvezda/artifacts/init/zvezda-15b-dense
  smoke_output_dir: /workspace/zvezda/artifacts/smoke/zvezda-15b-dense

configs:
  model: configs/zvezda-15b-dense.yaml
  tokenizer: configs/tokenizer/zvezda-bpe-152k-diagnostic.yaml
  init_policy: configs/init/init-policy-v0.yaml
  init_curriculum: configs/data/init-curriculum-v1.yaml
  storage: configs/data/runpod-storage-v0.yaml
  corpus_manifest: configs/tokenizer/corpus-manifest.yaml
  parallelism: configs/parallelism-b200-diagnostic.yaml

global_seed: 20260703

phases:
  - name: preflight
    command: python scripts/pod_preflight.py --launch configs/diagnostic/pod-launch-1xb200.yaml --probe-storage
  - name: tokenizer_train
    skip_if_exists: /workspace/zvezda/artifacts/tokenizer/tokenizer.json
    command: >
      python scripts/train_tokenizer.py
      --config configs/tokenizer/zvezda-bpe-152k-diagnostic.yaml
      --corpus-manifest configs/tokenizer/corpus-manifest.yaml
      --storage-config configs/data/runpod-storage-v0.yaml
      --output-dir /workspace/zvezda/artifacts/tokenizer
      --probe-storage
  - name: init_checkpoint
    skip_if_exists: /workspace/zvezda/artifacts/init/zvezda-15b-dense/checkpoint_manifest.json
    command: >
      python scripts/init_checkpoint.py
      --config configs/zvezda-15b-dense.yaml
      --init-policy configs/init/init-policy-v0.yaml
      --output-dir /workspace/zvezda/artifacts/init/zvezda-15b-dense
      --global-seed 20260703
      --shard-count 4
  - name: preflight_train
    depends_on:
      - tokenizer_train
      - init_checkpoint
    command: python scripts/pod_preflight.py --launch configs/diagnostic/pod-launch-1xb200.yaml --probe-storage --require-artifacts
  - name: smoke_train
    depends_on: preflight_train
    command: >
      python scripts/smoke_train.py
      --launch configs/diagnostic/pod-launch-1xb200.yaml

smoke_train:
  max_steps: 1000
  seq_len: 1024
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  log_every: 10
  save_every: 500
  mtp_weight: 0.0
  max_grad_norm: 1.0
  activation_checkpointing: true

stop_rules:
  loss_must_decrease: true
  max_grad_norm_spike: 1000.0
  require_checkpoint_roundtrip: true
  no_pretrain_claim: true
  no_stubs: true
  oom: fail
  nan_inf_loss: fail
  checkpoint_load_mismatch: fail
  tokenizer_missing: fail
  empty_corpus_manifest: fail

notes:
  - Launch provider: RunPod only. No AWS credentials or s3:// URIs.
  - Corpus URIs: runpod://<volume-relative-path> only (network volume).
  - Purpose: pipeline smoke / survival profile — not production pretrain.
  - 15B BF16 + optimizer on 1×B200 180GB is a high-risk survival smoke profile.
  - Keep seq_len=1024, micro_batch_size=1, activation checkpointing enabled.
  - Raise seq_len only after measured VRAM headroom (nvidia-smi after step 0).
  - Do not use torchrun on this profile; gpu_count 1 = plain python smoke_train.py.
  - init_checkpoint --shard-count is safetensors file split on disk, not GPU count.
  - skip_if_exists init marker: checkpoint_manifest.json (written by init_checkpoint.py).
  - MoE / 100B / 125B v2 / 300B v2: out of scope for this launch.
  - Placeholder hashes or template URIs fail validation (stubs = fail).
