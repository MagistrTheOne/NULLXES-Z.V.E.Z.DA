schema_version: 1
required_fields:
  - schema_version
  - program
  - storage_policy
  - files

storage_policy:
  launch_provider: runpod
  runpod_only: true

file_entry_required_fields:
  - segment
  - uri
  - license
  - content_hash

allowed_segments:
  - ru_curated
  - code_verified
  - math_formal
  - tool_action_traces
  - synthetic_verified
  - heldout_gate

report_segments:
  - ru_clean
  - code_python
  - code_typescript
  - code_rust
  - json_tool_calls
  - xml_tool_calls
  - markdown
  - math_latex

validation_rules:
  files_must_be_non_empty: true
  cloud_uri_required: true
  local_paths_allowed: false
  segment_must_be_allowed: true
  license_must_not_be_unknown: true
  content_hash_algorithm:
    - sha256
    - blake3
  no_duplicate_paths: true
  no_mock_data: true
  no_stubs: true
