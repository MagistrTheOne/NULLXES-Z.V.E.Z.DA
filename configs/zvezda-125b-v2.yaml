model:
  name: zvezda-125b-v2
  class: decoder_only_causal_moe
  architecture_basis:
    evidence_file: configs/architecture/evidence-2026.yaml
    baseline: "MiMo-style SWA/GA MoE with DeepSeek-style aux-loss-free routing."
  parameter_accounting:
    total_parameters: 120781291520
    active_parameters_per_token_training_lm_mtp: 16695443456
    active_parameters_per_token_transformer_body: 15445540864
