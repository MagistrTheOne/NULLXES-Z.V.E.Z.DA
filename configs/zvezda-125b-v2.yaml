  dimensions:
    num_layers: 48
    dense_prefix_layers: 1
    moe_layers: 47
    hidden_size: 4096
    vocab_size: 152576
    tie_embeddings: false

  normalization:
    type: rmsnorm
    placement: prenorm
    eps: 1.0e-6
    bias: false

  attention:
    type: hybrid_swa_global_gqa
    num_attention_heads: 64
    num_kv_heads: 8
    qk_head_dim: 192
    v_head_dim: 128
    head_dim: 128
    qkv_bias: false
    out_bias: false
    local_window: 128
    context_length: 32768
    max_extension_context_length: 1048576
    layer_pattern:
      period: 7
      layers:
        - full
        - sliding_window
        - sliding_window
        - sliding_window
        - sliding_window
        - sliding_window
        - sliding_window
    position:
      local_layers: rope
      full_layers: extended_rope
      rope_theta: 10000000
      partial_rotary_factor: 0.334
    attention_sink_bias:
      sliding_window: true
      full: false

  dense_prefix_ffn:
    type: swiglu
    hidden_size: 16384
    bias: false
    layers: [0]

  moe:
    enabled_from_layer: 1
    routed_experts: 96
    shared_experts: 1
    expert_hidden_size: 2048
    routed_top_k: 8
    router:
      scoring: normalized_sigmoid
      precision: fp32
      bias_update: aux_loss_free
      aux_loss: disabled
      sequence_balance_loss: minimal_gate_only
    capacity:
      token_drop_policy: strict_alert
      skipped_tokens_alert_threshold: 0.05
    metrics:
      - tokens_per_expert
      - router_entropy
      - expert_utilization
      - skipped_tokens
      - per_sequence_expert_balance

  mtp:
    enabled: true
    depth: 3
    extra_parameters: 50343936
    loss_weight: null
    note: "MTP loss weight must be set in the launch manifest, not guessed in architecture config."

  research_bets:
    gated_deltanet_interleave:
      enabled: false
      gate: "Replace SWA layers only after throughput gain and long-context gates pass."
    mla:
      enabled: false
      gate: "Enable only if KV-cache pressure dominates and kernels are production-ready."
    indexshare_sparse_attention:
      enabled: false
      gate: "Enable only for context extension beyond 32768 after sparse retrieval gates."
    l2_learned_memory:
      enabled: false
      gate: "Long-horizon eval improvement over L1/L3 baseline with no perplexity regression >1%."
    action_token_space:
      enabled: false
      gate: "Agentic environment success delta and no language-regression gate failure."
    machine_state_modality:
      enabled: false
      gate: "State-grounded eval gain and no training instability."

